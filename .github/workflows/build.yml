name: build

# Every push and PR: unit tests + build the installer (artifact).
# Pushing a tag vX.Y.Z also creates a GitHub Release from that installer.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path "switcher.py" -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match __version__ $version" }
          if (-not (Test-Path "docs\release-notes\v$version.md")) { throw "docs\release-notes\v$version.md is missing" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      # build.ps1 also runs the unit tests before building
      - name: Build exe and installer
        shell: pwsh
        run: ./build.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeSwitcher-Setup
          path: dist/ClaudeSwitcher-Setup-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ClaudeSwitcher-Setup
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          file=$(ls dist/ClaudeSwitcher-Setup-*.exe)
          {
            cat "docs/release-notes/${TAG}.md"
            echo
            echo "SHA-256: \`$(sha256sum "$file" | cut -d' ' -f1)\`"
            echo
            echo "Built automatically by GitHub Actions from this tag."
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$file" --clobber
            gh release edit "$TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" "$file" --title "$TAG" --notes-file notes.md --latest
          fi
